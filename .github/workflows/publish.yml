name: Publish Registry

# Auto-runs after CI passes on a push to main.
# workflow_run fires when the named workflow completes; the condition in the
# job gates on: (a) successful run and (b) push event (not a PR run).
# Also available as a manual trigger for out-of-band releases.
on:
  workflow_run:
    workflows: ["Skills Marketplace CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gate: only release when code paths changed — not docs, workflows, or templates.
  check-paths:
    name: Check for releasable changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Detect releasable paths
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — releasing unconditionally."
            exit 0
          fi

          sha="${{ github.event.workflow_run.head_sha }}"
          parent=$(git rev-parse "${sha}^")
          changed=$(git diff --name-only "${parent}" "${sha}")

          echo "Changed files:"
          echo "$changed"

          # Release only when skills, schema, scripts, or tests change.
          # Workflow files, docs, and root Markdown do not warrant a new version.
          if echo "$changed" | grep -qE '^(skills/|schema/|scripts/|tests/)'; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Releasable changes detected."
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "No releasable changes — skipping release."
          fi

  publish:
    name: Tag and release
    needs: check-paths
    if: needs.check-paths.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install check-jsonschema
        run: pip install "check-jsonschema==0.29.3"

      - name: Full validation
        run: |
          for dir in skills/*/; do
            ./scripts/validate.sh "$dir"
          done
          for meta in skills/*/metadata.json; do
            check-jsonschema --schemafile schema/metadata.schema.json "$meta"
          done
          ./scripts/check-registry.sh

      - name: Count skills
        id: summary
        run: |
          count=$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Registry contains $count skill(s)"

      - name: Compute next version and tag
        id: version
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            version="${latest#v}"
            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f2)
            patch=$(echo "$version" | cut -d. -f3)
            next="v${major}.${minor}.$((patch + 1))"
          fi

          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "Tagging $next (${{ steps.summary.outputs.count }} skills) @ $sha"
          git tag -a "$next" -m "Registry update: ${{ steps.summary.outputs.count }} skills" "$sha"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }} — ${{ steps.summary.outputs.count }} skills" \
            --generate-notes \
            --latest
